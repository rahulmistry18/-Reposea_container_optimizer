name: RepoSea Setup — First-Time Configuration

# Runs ONCE — the very first time this repo is set up (fork or original).
# Bootstraps the pipeline, patches URLs, deploys GitHub Pages, then marks
# itself done via .github/.setup_complete so it never runs meaningful work
# again — this prevents it from firing alongside pipeline.yml on every
# ordinary code push (which was causing two workflows to git push at the
# same time and conflict with each other).
#
# To re-run setup deliberately, delete .github/.setup_complete and push,
# or use workflow_dispatch (which always runs regardless of the marker).

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/gold/**"
      - "data/state/**"
      - "data/exports/**"

  workflow_dispatch:

permissions:
  contents: write
  pages:    write
  id-token: write
  actions:  write

concurrency:
  group: reposea-git-write-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Guard: only let this run once, ever, on a plain push ──────────────────
  check:
    name: "Check setup status"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered — running regardless of setup marker."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -f ".github/.setup_complete" ]; then
            echo "Initial setup already completed — skipping (this workflow only runs once automatically)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No setup marker found — running initial setup."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  setup-and-run:
    name: "Bootstrap RepoSea pipeline"
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (Bronze to Silver to Gold)
        run: python -m pipeline.run_pipeline --env prod
        env:
          PYTHONPATH: ${{ github.workspace }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Generate Excel report
        run: python -m pipeline.export_excel
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Patch dashboard URLs to this repo
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "Patching URLs for ${OWNER}/${REPO}"
          for FILE in dashboard/index.html dashboard/map.html docs/POWER_BI_GUIDE.md README.md; do
            [ -f "$FILE" ] || continue
            sed -i "s|YOUR_USERNAME/reposea|${OWNER}/${REPO}|g" "$FILE"
            sed -i "s|YOUR_USERNAME\.github\.io/reposea|${OWNER}.github.io/${REPO}|g" "$FILE"
            sed -i "s|YOUR_USERNAME|${OWNER}|g" "$FILE"
          done

      - name: Mark initial setup complete
        run: |
          mkdir -p .github
          echo "RepoSea initial setup completed on $(date -u +'%Y-%m-%dT%H:%M:%SZ') — this workflow will not auto-run again." > .github/.setup_complete

      - name: Commit outputs
        run: |
          git config user.name  "RepoSea Bot"
          git config user.email "pipeline@reposea.bot"
          git add .github/.setup_complete
          git add data/gold/ data/exports/ dashboard/ docs/ README.md
          git add data/state/container_history.json 2>/dev/null || true
          git add data/state/alerts_sent.json 2>/dev/null || true
          git add data/state/container_ledger.json 2>/dev/null || true
          git add data/state/completed_containers.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: initial pipeline run [skip ci]"
            # Guard against a race with another workflow pushing at the same
            # moment — rebase onto whatever landed first and retry a few times
            # rather than failing outright.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed — retrying after rebase..."
              sleep $((i * 5))
            done
          fi

      - name: Build GitHub Pages bundle
        run: |
          mkdir -p _site/data/gold _site/data/exports
          cp dashboard/index.html                       _site/index.html
          cp dashboard/map.html                         _site/map.html
          cp data/gold/containers.json                  _site/data/gold/containers.json
          cp data/gold/summary.json                     _site/data/gold/summary.json
          [ -f data/gold/history.json ] && cp data/gold/history.json _site/data/gold/history.json || true
          [ -f data/gold/market.json  ] && cp data/gold/market.json  _site/data/gold/market.json  || true
          [ -f data/exports/reposea_report.xlsx ] && cp data/exports/reposea_report.xlsx _site/data/exports/ || true
          echo "Pages bundle: $(du -sh _site | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print summary
        if: always()
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          python3 -c "
          import json, sys
          try:
              s = json.load(open('data/gold/summary.json'))
              print(f'Containers: {s[\"total_containers\"]} | Critical: {s[\"critical_count\"]} | Exposure: \${s[\"total_penalty_usd\"]:,.0f}')
          except Exception as e:
              print(f'Could not read summary: {e}')
          "
          echo "Dashboard: https://${OWNER}.github.io/${REPO}/"
          echo "Fleet Map: https://${OWNER}.github.io/${REPO}/map.html"
