<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RepoSea — Fleet Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --line:#E3E2DE; --line2:#EDECE8;
  --ink:#181A1B; --ink-dim:#6E7275; --ink-faint:#A3A6A8;
  --accent:#1F5C55; --accent-bg:#EAF1EF;
  --critical:#AE3B26; --critical-bg:#F7EAE6;
  --warning:#9C6B1F; --warning-bg:#F7F0E2;
  --safe:#3E7A5B; --safe-bg:#EAF3EE;
  --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0}
.leaflet-container{background:#EEF0EE}

/* Top bar */
.bar{position:absolute;top:0;left:0;right:0;z-index:1000;height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.logo-name{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.logo-name span{color:var(--accent)}
.nav{display:flex;gap:18px;margin-left:10px}
.nav a{font-size:13px;color:var(--ink-dim);text-decoration:none;padding-bottom:2px;border-bottom:1.5px solid transparent}
.nav a.act{color:var(--ink);border-color:var(--accent)}
.nav a:hover{color:var(--ink)}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.btn{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-faint);background:var(--bg)}
.ts{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

/* KPI strip */
.kpibar{position:absolute;top:52px;left:0;right:0;z-index:999;background:var(--surface);border-bottom:1px solid var(--line);display:flex;padding:0 20px}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:9px 16px;border-right:1px solid var(--line2);min-width:100px;gap:2px}
.kpi:last-child{border-right:none;margin-left:auto}
.kl{font-size:10.5px;color:var(--ink-dim)}
.kv{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.1;color:var(--ink)}
.kv.r{color:var(--critical)}.kv.a{color:var(--warning)}.kv.t{color:var(--accent)}.kv.o{color:var(--warning)}
.ks{font-size:10px;color:var(--ink-faint)}

/* Legend */
.legend{position:absolute;bottom:16px;left:16px;z-index:999;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:175px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ltitle{font-size:11px;font-weight:600;color:var(--ink-dim);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.lr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lr:last-child{margin-bottom:0}
.lc{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lsq{width:8px;height:8px;flex-shrink:0;border:1.5px solid var(--ink-faint)}
.ll{font-size:12px;color:var(--ink-dim)}
.lsep{border-top:1px solid var(--line2);margin:6px 0}

/* Filter panel */
.filters{position:absolute;bottom:16px;right:16px;z-index:999;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:180px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ftitle{font-size:11px;font-weight:600;color:var(--ink-dim);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.fg{margin-bottom:9px}
.fg:last-child{margin-bottom:0}
.fgl{font-size:10.5px;color:var(--ink-faint);margin-bottom:5px}
.fbtns{display:flex;flex-wrap:wrap;gap:4px}
.fb{font-family:var(--sans);font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--line);cursor:pointer;color:var(--ink-dim);background:var(--surface);transition:all .12s}
.fb:hover{color:var(--ink);border-color:var(--ink-faint)}
.fb.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.fb.on.r{color:var(--critical);border-color:var(--critical);background:var(--critical-bg)}
.fb.on.a{color:var(--warning);border-color:var(--warning);background:var(--warning-bg)}

/* Popups */
.leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:0 4px 20px rgba(0,0,0,.1)!important;padding:0!important;color:var(--ink)!important}
.leaflet-popup-content{margin:0!important;padding:0!important}
.leaflet-popup-tip{background:var(--surface)!important;border:1px solid var(--line)!important}
.leaflet-popup-close-button{color:var(--ink-faint)!important;font-size:16px!important;top:8px!important;right:9px!important}
.leaflet-popup-close-button:hover{color:var(--ink)!important}
.popup{padding:14px 16px;min-width:220px;font-family:var(--sans)}
.pid{font-family:var(--mono);font-size:14px;font-weight:600;margin-bottom:2px}
.pvessel{font-size:12px;color:var(--ink-dim);margin-bottom:8px}
.pstg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;margin-bottom:9px}
.pstg.AT_SEA{color:var(--accent);background:var(--accent-bg)}
.pstg.GATE_IN{color:var(--ink-dim);background:var(--line2)}
.pstg.ARRIVED{color:var(--accent);background:var(--accent-bg)}
.pstg.IN_FREE_DAYS{color:var(--warning);background:var(--warning-bg)}
.pstg.OVERDUE{color:var(--critical);background:var(--critical-bg)}
.prows{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line2);padding-top:8px}
.prow{display:flex;justify-content:space-between;gap:10px}
.pk{font-size:11px;color:var(--ink-faint)}
.pv{font-family:var(--mono);font-size:12px}
.pv.r{color:var(--critical)}.pv.a{color:var(--warning)}.pv.t{color:var(--accent)}
.pprog{border-top:1px solid var(--line2);padding-top:8px;margin-top:3px}
.pprog-lbl{font-size:11px;color:var(--ink-faint);margin-bottom:4px;display:flex;justify-content:space-between}
.pprog-track{height:4px;background:var(--line2);border-radius:2px;overflow:hidden}
.pprog-fill{height:100%;border-radius:2px}
.ptrail-btn{margin-top:10px;width:100%;font-family:var(--sans);font-size:11.5px;padding:6px 0;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer}
.ptrail-btn:hover{background:var(--accent-bg);border-color:var(--accent)}
.ptrail-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* conflict popup */
.cpopup{padding:14px 16px;min-width:210px;max-width:270px;font-family:var(--sans)}
.ctitle{font-size:13px;font-weight:600;margin-bottom:8px}
.crow{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line2)}
.crow:last-of-type{border-bottom:none}
.ck{font-size:11px;color:var(--ink-dim)}
.cv{font-size:11px;font-family:var(--mono)}
.cadv{margin-top:8px;padding-top:8px;border-top:1px solid var(--warning-bg);font-size:11px;color:var(--ink-dim);line-height:1.5}

@media (max-width:640px){
  .bar{padding:0 14px}.nav{display:none}
  .legend,.filters{min-width:150px;padding:10px 12px}
}
</style>
</head>
<body>
<div id="map"></div>

<!-- Top bar -->
<div class="bar">
  <a class="logo" href="./index.html">
    <div class="logo-name">Repo<span>Sea</span></div>
  </a>

    <a href="./index.html">Fleet</a>

<div class="legend">

  <div class="lr"><div style="width:20px;height:2px;background:var(--accent);flex-shrink:0;border-top:2px dashed var(--accent)"></div><div class="ll">Container trail (click a dot)</div></div>
  <div class="lsep"></div>
  <div class="lr">
    <svg width="11" height="11" viewBox="0 0 11 11" style="flex-shrink:0"><polygon points="5.5,1 10,10 1,10" fill="var(--warning)"/></svg>

<!-- Filters -->

      <button class="fb on"   data-f="status" data-v="Safe">Safe</button>
    </div>
  </div>
  <div class="fg">
    <div class="fgl">Stage</div>
    <div class="fbtns">
      <button class="fb on" data-f="stage" data-v="GATE_IN">Gate-In</button>
      <button class="fb on" data-f="stage" data-v="AT_SEA">At Sea</button>
      <button class="fb on" data-f="stage" data-v="ARRIVED">Arrived</button>
      <button class="fb on" data-f="stage" data-v="IN_FREE_DAYS">Free Days</button>
      <button class="fb on" data-f="stage" data-v="OVERDUE">Overdue</button>
    </div>
  </div>
  <div class="fg">
    <div class="fgl">Lane</div>

      <button class="fb on" data-f="lane" data-v="INTRA_ASIA">Intra</button>
    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ══ Port coordinates — UN/LOCODE anchorage positions ══════════════════════
const P = {

  USOAK:[37.80,-122.33],USSAV:[32.08,-81.09],USBAL:[39.27,-76.58],
  USBOS:[42.36,-71.00], CNYTN:[22.61,114.27],CNQIN:[36.07,120.38],
  JPYOK:[35.44,139.65], THLCH:[13.08,100.90],PHMNL:[14.58,120.97],
  VNSGN:[10.78,107.02], INPAV:[18.96,72.95], HKHKG:[22.32,114.19],
  FRFOS:[43.32,5.33],   ESBCN:[41.34,2.17],  MYBTU:[5.84,118.10],
  IDPNK:[-3.80,114.74], LB:   [33.74,-118.20],
};

// ══ Ocean routes — hand-crafted waypoints, NO land crossing ══════════════
// Trans-Pacific: arc north over Pacific (Great Circle), crosses antimeridian correctly
// Asia-Europe: goes south through Indian Ocean → Red Sea → Med
const R = {
  // ── TRANS-PACIFIC ──────────────────────────────────────────────────────
  'CNSHA-USLAX': [[31.22,121.47],[34,137],[40,155],[44,170],[46,-178],[44,-165],[40,-150],[36,-135],[33.73,-118.27]],
  'CNSHA-USLONG':[[31.22,121.47],[34,137],[40,155],[44,170],[46,-178],[44,-165],[40,-150],[36,-135],[33.74,-118.20]],
  'CNSHA-USSEA': [[31.22,121.47],[35,138],[42,153],[48,168],[51,178],[49,-170],[47.57,-122.40]],
  'CNSHA-USOAK': [[31.22,121.47],[34,137],[40,155],[44,170],[46,-178],[44,-165],[40,-150],[37.80,-122.33]],
  'CNYTN-USLAX': [[22.61,114.27],[27,125],[34,140],[41,157],[45,173],[46,-178],[43,-162],[37,-140],[33.73,-118.27]],
  'TWKHH-USSEA': [[22.62,120.27],[28,132],[36,148],[44,163],[50,176],[52,178],[49,-170],[47.57,-122.40]],
  'HKHKG-USLAX': [[22.32,114.19],[26,127],[33,143],[40,158],[44,173],[46,-178],[43,-160],[36,-140],[33.73,-118.27]],
  'KRPUS-USLONG':[[35.10,129.04],[38,140],[43,156],[47,170],[48,-178],[46,-165],[40,-150],[33.74,-118.20]],
  'KRPUS-USSEA': [[35.10,129.04],[39,142],[45,157],[50,170],[52,178],[49,-170],[47.57,-122.40]],
  'CNQIN-USOAK': [[36.07,120.38],[39,137],[43,153],[46,168],[47,-178],[45,-162],[37.80,-122.33]],
  // ── TRANS-ATLANTIC ────────────────────────────────────────────────────
  'NLRTM-USNYC': [[51.90,4.05],[50,-8],[47,-22],[45,-38],[43,-52],[41,-65],[40.64,-74.01]],
  'DEHAM-USNYC': [[53.54,9.94],[52,-4],[49,-18],[46,-34],[43,-50],[41,-64],[40.64,-74.01]],
  'BEANR-USNYC': [[51.22,4.40],[50,-9],[47,-24],[44,-40],[42,-56],[40.64,-74.01]],
  'GBFXT-USBOS': [[51.95,1.32],[50,-9],[47,-23],[44,-39],[42,-54],[42.36,-71.00]],
  'NLRTM-USSAV': [[51.90,4.05],[48,-9],[43,-24],[38,-42],[33,-62],[32.08,-81.09]],
  'DEHAM-USBAL': [[53.54,9.94],[51,-4],[47,-19],[43,-36],[40,-54],[39.27,-76.58]],
  'FRFOS-USNYC': [[43.32,5.33],[38,-5],[34,-20],[34,-40],[37,-58],[40.64,-74.01]],
  'ESBCN-USNYC': [[41.34,2.17],[36,-9],[33,-23],[34,-44],[37,-62],[40.64,-74.01]],
  // ── ASIA-EUROPE — via Indian Ocean + Suez ─────────────────────────────
  'CNSHA-NLRTM': [[31.22,121.47],[22,115],[10,107],[2,100],[-2,96],[5,80],[12.5,43.3],[25,40],[30,32],[32,27],[36,15],[44,8],[51.90,4.05]],
  'CNSHA-DEHAM': [[31.22,121.47],[22,115],[10,107],[2,100],[-2,96],[5,80],[12.5,43.3],[25,40],[30,32],[32,27],[36,15],[50,8],[53.54,9.94]],
  'CNSHA-GBFXT': [[31.22,121.47],[22,115],[10,107],[2,100],[-2,96],[5,80],[12.5,43.3],[25,40],[30,32],[32,27],[36,15],[44,4],[51.95,1.32]],
  'CNSHA-BEANR': [[31.22,121.47],[22,115],[10,107],[2,100],[-2,96],[5,80],[12.5,43.3],[25,40],[30,32],[32,27],[36,15],[44,5],[51.22,4.40]],
  'KRPUS-NLRTM': [[35.10,129.04],[28,120],[18,110],[8,103],[2,100],[-2,96],[5,80],[12.5,43.3],[25,40],[30,32],[32,27],[36,15],[51.90,4.05]],
  'SGSIN-DEHAM': [[1.27,103.82],[5,90],[8,75],[12.5,43.3],[25,40],[30,32],[32,27],[36,15],[53.54,9.94]],
  'HKHKG-BEANR': [[22.32,114.19],[18,108],[8,103],[2,100],[-2,96],[5,80],[12.5,43.3],[25,40],[30,32],[32,27],[36,15],[51.22,4.40]],
  // ── INTRA-ASIA ────────────────────────────────────────────────────────
  'CNSHA-SGSIN': [[31.22,121.47],[25,118],[18,112],[10,107],[4,105],[1.27,103.82]],
  'TWKHH-SGSIN': [[22.62,120.27],[18,116],[12,110],[6,106],[1.27,103.82]],
  'HKHKG-PHMNL': [[22.32,114.19],[20,116],[17,119],[14.58,120.97]],
  'SGSIN-MYBTU': [[1.27,103.82],[3,107],[5.84,118.10]],
  'CNSHA-JPYOK': [[31.22,121.47],[33,128],[35.44,139.65]],
  'KRPUS-JPYOK': [[35.10,129.04],[35.3,133],[35.44,139.65]],
  'CNSHA-THLCH': [[31.22,121.47],[25,118],[18,112],[12,108],[8,104],[13.08,100.90]],
  'CNSHA-VNSGN': [[31.22,121.47],[25,118],[18,115],[14,112],[10.78,107.02]],
  'HKHKG-SGSIN': [[22.32,114.19],[16,110],[8,106],[1.27,103.82]],
};

// Get route — try both directions
function getRoute(o, d) {
  const key = o+'-'+d;
  const rkey = d+'-'+o;
  if (R[key]) return R[key];
  if (R[rkey]) return R[rkey].slice().reverse();
  // Straight line fallback (only for truly unknown pairs)
  const op = P[o], dp = P[d];
  return (op && dp) ? [op, dp] : null;
}

// Interpolate position at fraction t (0–1) along a route array
function routePos(route, t) {
  if (!route || route.length < 2) return null;
  const n = route.length - 1;
  const seg = Math.min(Math.floor(t * n), n - 1);
  const f   = t * n - seg;
  const a   = route[seg], b = route[seg + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}

// ══ Geopolitical conflict zones — April 2026 ═════════════════════════════
const CONFLICTS = [
  {
    name: 'Strait of Hormuz', lat: 26.57, lon: 56.45, sev: 'HIGH', color: '#9C6B1F',
    rows: [
      ['Severity','HIGH'], ['Status','Transit restrictions active'],
      ['Insurance','+400% war risk premium'], ['Delay','3–7 days per transit'],
      ['Lanes affected','Asia-Europe, Intra-Asia'],
    ],
    advisory: 'UKMTO advises 60 nm exclusion zone. Most carriers requesting armed naval escorts.',
  },
  {
    name: 'Red Sea / Bab-el-Mandeb', lat: 12.58, lon: 43.32, sev: 'CRITICAL', color: '#AE3B26',
    rows: [
      ['Severity','CRITICAL'], ['Status','Active Houthi interdiction'],
      ['Insurance','+400% war risk premium'], ['Delay','10–14 days (Cape reroute)'],
      ['Lanes affected','Asia-Europe, Trans-Atlantic'],
    ],
    advisory: 'Houthi missile/drone attacks ongoing since Nov 2023. Most Asia-EU carriers now route via Cape of Good Hope (+$1M fuel per voyage).',
  },
];

// ══ Status colours ═══════════════════════════════════════════════════════
const SC = { Critical:'#AE3B26', Warning:'#9C6B1F', Safe:'#1F5C55' };
const SL = { GATE_IN:'Gate-In', AT_SEA:'At Sea', ARRIVED:'Arrived', IN_FREE_DAYS:'Free Days', OVERDUE:'Overdue' };

// ══ Map setup ════════════════════════════════════════════════════════════
const map = L.map('map', {
  center: [20, 15], zoom: 2, minZoom: 2, maxZoom: 9,
  zoomControl: false, attributionControl: false,
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
  { maxZoom:19, subdomains:'abcd' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
  { maxZoom:19, subdomains:'abcd', opacity:0.65 }).addTo(map);
L.control.zoom({ position:'topright' }).addTo(map);

// ══ State ════════════════════════════════════════════════════════════════
let DATA = [];
let HISTORY = {};
let layers = [];
let trailLayers = [];
let activeTrailId = null;
const fStatus = new Set(['Critical','Warning','Safe']);
const fStage  = new Set(['GATE_IN','AT_SEA','ARRIVED','IN_FREE_DAYS','OVERDUE']);
const fLane   = new Set(['TRANS_PAC','TRANS_ATL','ASIA_EUR','INTRA_ASIA']);

// ══ Trails — draw a container's historical lat/lon path ═══════════════════
function clearTrail() {
  trailLayers.forEach(l => map.removeLayer(l));
  trailLayers = [];
}

function drawTrail(cid) {
  clearTrail();
  const snaps = (HISTORY[cid] || []).filter(s =>
    (Math.abs(s.lat) > 0.05 || Math.abs(s.lon) > 0.05)
  );
  if (snaps.length < 2) return false;

  const latlngs = snaps.map(s => [s.lat, s.lon]);
  trailLayers.push(
    L.polyline(latlngs, { color: '#1F5C55', weight: 2, opacity: 0.6, dashArray: '2,7' }).addTo(map)
  );
  snaps.forEach((s, i) => {
    const isLast = i === snaps.length - 1;
    trailLayers.push(
      L.circleMarker([s.lat, s.lon], {
        radius: isLast ? 5 : 3,
        color: SC[s.status] || '#1F5C55',
        fillColor: SC[s.status] || '#1F5C55',
        fillOpacity: 0.9,
        weight: isLast ? 2 : 1,
      })
      .bindTooltip(`${s.ts} · ${SL[s.stage] || s.stage}`, { direction: 'top', offset: [0, -4] })
      .addTo(map)
    );
  });
  return latlngs;
}

function toggleTrail(cid) {
  let latlngs = null;
  if (activeTrailId === cid) {
    clearTrail();
    activeTrailId = null;
  } else {
    latlngs = drawTrail(cid);
    activeTrailId = latlngs ? cid : null;
  }
  // refresh the open popup's button state
  document.querySelectorAll('.ptrail-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.cid === activeTrailId);
    b.textContent = b.dataset.cid === activeTrailId ? '● Hide trail' : '○ Show trail';
  });
  return latlngs;
}
window.toggleTrail = toggleTrail;

// ══ Icon factories ════════════════════════════════════════════════════════
function containerDot(color, radius, pulsing) {
  const pulse = pulsing
    ? `<circle cx="10" cy="10" r="${radius+6}" fill="${color}" opacity="0.15"/>`
    : '';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
    ${pulse}
    <circle cx="10" cy="10" r="${radius}" fill="${color}" opacity="0.9"/>
    <circle cx="10" cy="10" r="${radius*0.42}" fill="white" opacity="0.6"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [20,20], iconAnchor: [10,10] });
}

function portSquare() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8">
    <rect x="1" y="1" width="6" height="6" rx="1"
      fill="rgba(232,244,246,0.08)" stroke="rgba(232,244,246,0.32)" stroke-width="1"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [8,8], iconAnchor: [4,4] });
}

function conflictTriangle(color) {
  // Triangle — clearly distinct from circular container dots
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">
    <polygon points="13,2 24,22 2,22" fill="${color}" opacity="0.88" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <text x="13" y="17" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="sans-serif">!</text>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [26,26], iconAnchor: [13,22] });
}

// ══ Popup builders ════════════════════════════════════════════════════════
function containerPopup(d) {
  const dtl   = Number(d.days_to_lfd || 0);
  const dc    = dtl <= 0 ? 'r' : dtl <= 2 ? 'a' : 't';
  const pct   = Number(d.voyage_pct || 0);
  const pc    = pct >= 80 ? '#AE3B26' : pct >= 50 ? '#9C6B1F' : '#1F5C55';
  const burn  = Number(d.burn_rate_usd || 0);
  const proj  = Number(d.projected_exposure_7d_usd || 0);
  const vessel = d.vessel_name || '—';
  const hasHistory = (HISTORY[d.container_id] || []).length >= 2;
  const isOn = activeTrailId === d.container_id;
  return `<div class="popup">
    <div class="pid">${d.container_id}</div>
    <div class="pvessel">${vessel}</div>
    <span class="pstg ${d.lifecycle_stage}">${SL[d.lifecycle_stage] || d.lifecycle_stage}</span>
    <div class="prows">
      <div class="prow"><div class="pk">Route</div><div class="pv">${d.origin_locode} → ${d.dest_locode}</div></div>
      <div class="prow"><div class="pk">Lane</div><div class="pv">${d.trade_lane_label || d.trade_lane}</div></div>
      <div class="prow"><div class="pk">Contract</div><div class="pv">${d.lease_type}</div></div>
      <div class="prow"><div class="pk">Buffer</div><div class="pv ${dc}">${dtl >= 0 ? '+' : ''}${dtl.toFixed(1)}d</div></div>
      <div class="prow"><div class="pk">Exposure</div><div class="pv ${dtl<=0?'r':''}">
        ${dtl <= 0 ? '$'+Math.round(burn).toLocaleString()+' accrued' : '$'+d.per_diem_rate+'/day'}
      </div></div>
      <div class="prow"><div class="pk">7d Forecast</div><div class="pv a">$${Math.round(proj).toLocaleString()}</div></div>
      <div class="prow"><div class="pk">Strategy</div><div class="pv t" style="font-size:11px">${d.repo_strategy || '—'}</div></div>
      <div class="prow"><div class="pk">Priority</div><div class="pv" style="color:${d.priority_score>=9?'#AE3B26':d.priority_score>=7?'#9C6B1F':'#1F5C55'}">${d.priority_score || 1}/10</div></div>
    </div>
    <div class="pprog">
      <div class="pprog-lbl"><span>Voyage progress</span><span>${pct}%</span></div>
      <div class="pprog-track"><div class="pprog-fill" style="width:${pct}%;background:${pc}"></div></div>
    </div>
    ${hasHistory
      ? `<button class="ptrail-btn ${isOn ? 'on' : ''}" data-cid="${d.container_id}" onclick="toggleTrail('${d.container_id}')">${isOn ? '● Hide trail' : '○ Show trail'}</button>`
      : `<div style="margin-top:10px;font-size:10.5px;color:var(--ink-faint)">Trail builds up as the pipeline runs</div>`
    }
  </div>`;
}

function conflictPopup(z) {
  const rows = z.rows.map(([k,v]) =>
    `<div class="crow"><div class="ck">${k}</div><div class="cv" style="color:${k==='Severity'||k==='Status'?z.color:'#E8F4F6'}">${v}</div></div>`
  ).join('');
  return `<div class="cpopup">
    <div class="ctitle" style="color:${z.color}">⚠ ${z.name}</div>
    ${rows}
    <div class="cadv">${z.advisory}</div>
  </div>`;
}

// ══ Render ════════════════════════════════════════════════════════════════
function render() {
  layers.forEach(l => map.removeLayer(l));
  layers = [];

  const visible = DATA.filter(d =>
    fStatus.has(d.action_status) &&
    fStage.has(d.lifecycle_stage) &&
    fLane.has(d.trade_lane)
  );

  const portsDrawn = new Set();

  visible.forEach(d => {
    const o    = d.origin_locode;
    const dest = d.dest_locode;
    const oPos = P[o];
    const dPos = P[dest];
    const route = getRoute(o, dest);
    const color = SC[d.action_status] || '#0A9396';
    const pct   = Math.max(0, Math.min(1, Number(d.voyage_pct || 0) / 100));

    // ── Route arc — single clean polyline, no dots, no dashes ────────────
    if (route && route.length >= 2) {
      const line = L.polyline(route, {
        color:   d.action_status === 'Critical' ? '#AE3B26'
               : d.action_status === 'Warning'  ? '#9C6B1F'
               : 'rgba(31,92,85,0.45)',
        weight:  1.2,
        opacity: d.action_status === 'Critical' ? 0.65 : 0.38,
      }).addTo(map);
      layers.push(line);
    }

    // ── Port squares at origin + destination only ─────────────────────────
    [[o, oPos], [dest, dPos]].forEach(([code, pos]) => {
      if (!pos || portsDrawn.has(code)) return;
      portsDrawn.add(code);
      layers.push(L.marker(pos, { icon: portSquare(), interactive: false }).addTo(map));
    });

    // ── Container dot — position determined by stage ──────────────────────
    let lat = 0, lon = 0;

    if (d.lifecycle_stage === 'AT_SEA' && route) {
      // Always compute from route geometry — guarantees ocean placement
      const pos = routePos(route, Math.max(0.03, Math.min(0.97, pct)));
      if (pos) { lat = pos[0]; lon = pos[1]; }
    } else if (d.lifecycle_stage === 'GATE_IN' && oPos) {
      lat = oPos[0]; lon = oPos[1];
    } else if (['ARRIVED','IN_FREE_DAYS','OVERDUE'].includes(d.lifecycle_stage) && dPos) {
      lat = dPos[0]; lon = dPos[1];
    } else {
      // Use stored coordinates as last resort
      lat = Number(d.current_lat || 0);
      lon = Number(d.current_lon || 0);
    }

    if (Math.abs(lat) < 0.1 && Math.abs(lon) < 0.1) return; // skip (0,0)

    const isCrit = d.action_status === 'Critical';
    const r      = d.lifecycle_stage === 'AT_SEA' ? 6 : 5;

    const m = L.marker([lat, lon], {
      icon: containerDot(color, r, isCrit),
      zIndexOffset: isCrit ? 1000 : d.lifecycle_stage === 'AT_SEA' ? 500 : 0,
    })
    .bindPopup(containerPopup(d), { maxWidth: 260 })
    .addTo(map);
    layers.push(m);
  });

  // ── Conflict zone markers — always on top ─────────────────────────────
  CONFLICTS.forEach(z => {
    // Dashed pulsing ring — distinct from container dots
    const ring = L.circle([z.lat, z.lon], {
      radius:      z.sev === 'CRITICAL' ? 160000 : 110000,
      color:       z.color,
      fillColor:   z.color,
      fillOpacity: 0.05,
      weight:      1.5,
      opacity:     0.5,
      dashArray:   '6,5',
    }).addTo(map);
    layers.push(ring);

    const m = L.marker([z.lat, z.lon], {
      icon: conflictTriangle(z.color),
      zIndexOffset: 2000,
    })
    .bindPopup(conflictPopup(z), { maxWidth: 270 })
    .addTo(map);
    layers.push(m);
  });

  renderKPIs(visible);

  // Re-draw the active trail after clearing/rebuilding layers, since a
  // filter change or refresh would otherwise silently drop it.
  if (activeTrailId) {
    if (visible.some(d => d.container_id === activeTrailId)) {
      drawTrail(activeTrailId);
    } else {
      clearTrail();
      activeTrailId = null;
    }
  }
}

function renderKPIs(visible) {
  const all  = DATA;
  const crit = all.filter(d => d.action_status === 'Critical').length;
  const warn = all.filter(d => d.action_status === 'Warning').length;
  const safe = all.filter(d => d.action_status === 'Safe').length;
  const pen  = all.filter(d => Number(d.days_to_lfd||0) <= 0)
                  .reduce((s,d) => s + Number(d.burn_rate_usd||0), 0);
  const proj = all.reduce((s,d) => s + Number(d.projected_exposure_7d_usd||0), 0);

  const kpis = [
    { l:'Critical',      v: crit,                              c:'r', s:'penalty accruing' },
    { l:'Warning',       v: warn,                              c:'a', s:'≤ 2d buffer' },
    { l:'Safe',          v: safe,                              c:'t', s:'buffer OK' },
    { l:'Penalty',       v: '$'+Math.round(pen).toLocaleString(), c:'', s:'USD today' },
    { l:'7d Forecast',   v: '$'+Math.round(proj).toLocaleString(),c:'r', s:'projected' },
    { l:'Conflict Zones',v: CONFLICTS.length,                  c:'o', s:'active Apr 2026' },
    { l:'Showing',       v: visible.length+'/'+all.length,     c:'', s:'containers' },
  ];

  document.getElementById('kpibar').innerHTML = kpis.map(k =>
    `<div class="kpi">
      <div class="kl">${k.l}</div>
      <div class="kv ${k.c}">${k.v}</div>
      <div class="ks">${k.s}</div>
    </div>`
  ).join('');
}

// ══ Filters ══════════════════════════════════════════════════════════════
document.querySelectorAll('.fb').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.f, v = btn.dataset.v;
    const set = f === 'status' ? fStatus : f === 'stage' ? fStage : fLane;
    if (set.has(v)) { set.delete(v); btn.classList.remove('on'); }
    else            { set.add(v);    btn.classList.add('on'); }
    render();
  });
});

];

async function loadData() {
  try {
    const [cr, sr, hr] = await Promise.all([
      fetch('./data/gold/containers.json?t=' + Date.now()),
      fetch('./data/gold/summary.json?t='    + Date.now()),
      fetch('./data/gold/history.json?t='    + Date.now()),
    ]);
    DATA = await cr.json();
    const sum = await sr.json();
    try { const hd = await hr.json(); HISTORY = hd.snapshots || {}; } catch (e) { HISTORY = {}; }
    document.getElementById('ts-label').textContent =
      'Run #' + (sum.run_count || '?') + ' · ' +
      (sum.generated_at || '').slice(0, 16).replace('T', ' ') + ' UTC';
  } catch(e) {
    DATA = FALLBACK;
    HISTORY = {};
    document.getElementById('ts-label').textContent = 'Offline · sample data';
  }
  render();
  focusFromQueryParam();
}

// If a container is named in the URL (?container=ID), e.g. via a "Track
// trail on map" link from the dashboard, center on it, open its popup,
// and draw its trail automatically.
let queryFocusHandled = false;
function focusFromQueryParam() {
  if (queryFocusHandled) return;
  const params = new URLSearchParams(window.location.search);
  const cid = params.get('container');
  if (!cid) return;
  const d = DATA.find(x => x.container_id === cid);
  if (!d) return;
  queryFocusHandled = true;

  // Make sure it's visible regardless of current filter state
  fStatus.add(d.action_status);
  fStage.add(d.lifecycle_stage);
  fLane.add(d.trade_lane);
  document.querySelectorAll('.fb').forEach(btn => {
    const f = btn.dataset.f, v = btn.dataset.v;
    const set = f === 'status' ? fStatus : f === 'stage' ? fStage : fLane;
    btn.classList.toggle('on', set.has(v));
  });
  render();

  const lat = Number(d.current_lat || 0), lon = Number(d.current_lon || 0);
  const trailBounds = toggleTrail(cid);
  if (trailBounds && trailBounds.length >= 2) {
    map.fitBounds(trailBounds, { padding: [80, 80] });
  } else if (Math.abs(lat) > 0.05 || Math.abs(lon) > 0.05) {
    map.setView([lat, lon], 4);
  }
}

async function doRefresh() {
  const btn = document.querySelector('.bar-r .btn');
  const original = btn.textContent;
  btn.textContent = 'Refreshing…'; btn.disabled = true;
  await loadData();
  btn.textContent = 'Done'; btn.disabled = false;
  setTimeout(() => { btn.textContent = original; }, 1500);
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
