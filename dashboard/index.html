<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepoSea — Fleet</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --line:#E3E2DE; --line2:#EDECE8;
  --ink:#181A1B; --ink-dim:#6E7275; --ink-faint:#A3A6A8;
  --accent:#1F5C55; --accent-bg:#EAF1EF;
  --critical:#AE3B26; --critical-bg:#F7EAE6;
  --warning:#9C6B1F; --warning-bg:#F7F0E2;
  --safe:#3E7A5B; --safe-bg:#EAF3EE;
  --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.header{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-name{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand-name span{color:var(--accent)}
.nav{display:flex;gap:18px}
.nav a{font-size:13px;color:var(--ink-dim);text-decoration:none;padding-bottom:2px;border-bottom:1.5px solid transparent}
.nav a.act{color:var(--ink);border-color:var(--accent)}
.nav a:hover{color:var(--ink)}
.header-right{display:flex;align-items:center;gap:14px}
.run-stamp{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.btn{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-faint);background:var(--bg)}
.btn:disabled{opacity:.55;cursor:default}

/* Main */
.main{max-width:1180px;margin:0 auto;padding:28px 28px 60px}

/* Tally strip (signature element) */
.tally{margin-bottom:28px}
.tally-nums{display:flex;gap:36px;margin-bottom:12px;flex-wrap:wrap}
.tally-item{cursor:pointer}
.tally-item .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.tally-item .l{font-size:12px;color:var(--ink-dim);margin-top:2px}
.tally-item.critical .n{color:var(--critical)}
.tally-item.warning .n{color:var(--warning)}
.tally-item.safe .n{color:var(--safe)}
.tally-bar{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--line2)}
.tally-seg{height:100%;transition:width .4s ease}
.tally-seg.critical{background:var(--critical)}
.tally-seg.warning{background:var(--warning)}
.tally-seg.safe{background:var(--safe)}

/* Controls */
.controls{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seg-grp{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg{padding:6px 13px;font-family:var(--sans);font-size:12.5px;cursor:pointer;color:var(--ink-dim);border:none;background:var(--surface);border-right:1px solid var(--line)}
.seg:last-child{border-right:none}
.seg:hover{background:var(--bg);color:var(--ink)}
.seg.act{background:var(--ink);color:var(--surface)}
.select,.search{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);color:var(--ink);outline:none}
.search{width:200px}
.search:focus,.select:focus{border-color:var(--accent)}
.spacer{flex:1}
.rcount{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}

/* Table */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--ink-dim);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--ink)}
thead th.sorted{color:var(--accent)}
tbody tr{border-bottom:1px solid var(--line2);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg)}
tbody td{padding:10px 14px;font-size:13px;color:var(--ink);white-space:nowrap}
.id{font-family:var(--mono);font-weight:600}
.dim{color:var(--ink-dim)}
.route{color:var(--ink-dim);font-size:12.5px}
.days{font-family:var(--mono)}
.days.over{color:var(--critical)}
.days.soon{color:var(--warning)}
.burn{font-family:var(--mono)}
.burn.acc{color:var(--critical)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:10px}
.pill.critical{background:var(--critical-bg);color:var(--critical)}
.pill.warning{background:var(--warning-bg);color:var(--warning)}
.pill.safe{background:var(--safe-bg);color:var(--safe)}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.empty{padding:48px 20px;text-align:center;color:var(--ink-dim);font-size:13.5px}

/* Footer */
.footer{max-width:1180px;margin:26px auto 0;padding:0 28px;display:flex;gap:18px;flex-wrap:wrap}
.footer a{font-size:12.5px;color:var(--ink-dim);text-decoration:none;border-bottom:1px solid transparent}
.footer a:hover{color:var(--accent);border-color:var(--accent)}

/* Detail panel */
.overlay{position:fixed;inset:0;background:rgba(24,26,27,.28);opacity:0;pointer-events:none;transition:opacity .18s;z-index:100}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;z-index:101;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.panel-id{font-family:var(--mono);font-size:17px;font-weight:600}
.panel-sub{font-size:12.5px;color:var(--ink-dim);margin-top:3px}
.panel-close{border:none;background:none;font-size:13px;color:var(--ink-dim);cursor:pointer;padding:4px}
.panel-close:hover{color:var(--ink)}
.panel-body{padding:20px 24px;overflow-y:auto;flex:1}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:22px}
.meta-item .l{font-size:11px;color:var(--ink-faint);margin-bottom:2px}
.meta-item .v{font-family:var(--mono);font-size:13px}
.hist-title{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.hist-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12px}
.hist-row .t{font-family:var(--mono);color:var(--ink-dim);white-space:nowrap}
.hist-row .s{color:var(--ink-dim)}
.hist-empty{font-size:12.5px;color:var(--ink-faint);padding:8px 0}

@media (max-width:640px){
  .header{padding:14px 16px}.nav{display:none}.main{padding:20px 16px 40px}
  .footer{padding:0 16px}.panel{width:100%}
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-name">Repo<span>Sea</span></div>
    <div class="nav">
      <a href="./index.html" class="act">Fleet</a>
      <a href="./map.html">Map</a>
    </div>
  </div>
  <div class="header-right">
    <span class="run-stamp" id="run-stamp">—</span>
    <button class="btn" id="refresh-btn" onclick="doRefresh()">Refresh</button>
  </div>
</div>

<div class="main">

  <div class="tally">
    <div class="tally-nums">
      <div class="tally-item" onclick="setStatus('ALL')"><div class="n" id="t-total">—</div><div class="l">Containers</div></div>
      <div class="tally-item critical" onclick="setStatus('Critical')"><div class="n" id="t-crit">—</div><div class="l">Critical</div></div>
      <div class="tally-item warning" onclick="setStatus('Warning')"><div class="n" id="t-warn">—</div><div class="l">Warning</div></div>
      <div class="tally-item safe" onclick="setStatus('Safe')"><div class="n" id="t-safe">—</div><div class="l">Safe</div></div>
      <div class="tally-item"><div class="n" id="t-exposure">—</div><div class="l">Accrued exposure</div></div>
    </div>
    <div class="tally-bar" id="tally-bar"></div>
  </div>

  <div class="controls">
    <div class="seg-grp" id="status-filter">
      <button class="seg act" data-v="ALL">All</button>
      <button class="seg" data-v="Critical">Critical</button>
      <button class="seg" data-v="Warning">Warning</button>
      <button class="seg" data-v="Safe">Safe</button>
    </div>
    <select class="select" id="lane-filter">
      <option value="ALL">All lanes</option>
      <option value="TRANS_PAC">Trans-Pacific</option>
      <option value="TRANS_ATL">Trans-Atlantic</option>
      <option value="ASIA_EUR">Asia-Europe</option>
      <option value="INTRA_ASIA">Intra-Asia</option>
    </select>
    <input class="search" id="search" placeholder="Search ID, vessel, port…">
    <div class="spacer"></div>
    <span class="rcount" id="rcount">—</span>
  </div>

  <div class="tbl-wrap">
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th data-col="container_id">Container</th>
            <th data-col="trade_lane">Lane</th>
            <th data-col="lifecycle_stage">Stage</th>
            <th data-col="vessel_name">Vessel → Dest</th>
            <th data-col="days_to_lfd">Days to LFD</th>
            <th data-col="burn_rate_usd">Burn (USD)</th>
            <th data-col="priority_score">Priority</th>
            <th data-col="action_status">Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">No containers match these filters.</div>
  </div>

</div>

<div class="footer">
  <a href="./map.html">Fleet map</a>
  <a href="./data/exports/reposea_report.xlsx" download>Excel report</a>
  <a href="./data/gold/containers.json">Raw JSON</a>
  <a href="./data/gold/summary.json">Summary JSON</a>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <div>
      <div class="panel-id" id="p-id">—</div>
      <div class="panel-sub" id="p-sub">—</div>
    </div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="meta-grid" id="p-meta"></div>
    <div class="hist-title">Recent history</div>
    <div id="p-hist"></div>
  </div>
</div>

<script>
let D = [], H = {}, S = {};
let aStatus = 'ALL', aLane = 'ALL', sQ = '', sCol = 'priority_score', sDir = -1;

const LANE_LABEL = {TRANS_PAC:'Trans-Pacific', TRANS_ATL:'Trans-Atlantic', ASIA_EUR:'Asia-Europe', INTRA_ASIA:'Intra-Asia'};
const STAGE_LABEL = {GATE_IN:'Gate-In', AT_SEA:'At sea', ARRIVED:'Arrived', IN_FREE_DAYS:'Free days', OVERDUE:'Overdue', COMPLETE:'Done'};

async function loadData() {
  try {
    const [dr, sr, hr] = await Promise.all([
      fetch('./data/gold/containers.json?t=' + Date.now()),
      fetch('./data/gold/summary.json?t=' + Date.now()),
      fetch('./data/gold/history.json?t=' + Date.now()),
    ]);
    if (!dr.ok) throw new Error(dr.status);
    D = await dr.json();
    S = await sr.json();
    try { const hd = await hr.json(); H = hd.snapshots || {}; } catch (e) { H = {}; }
    const ts = (S.generated_at || '').slice(0, 16).replace('T', ' ');
    document.getElementById('run-stamp').textContent = 'Run #' + (S.run_count || '?') + ' · ' + ts + ' UTC';
  } catch (e) {
    D = []; S = {}; H = {};
    document.getElementById('run-stamp').textContent = 'No data yet';
  }
  renderAll();
}

async function doRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true; btn.textContent = 'Refreshing…';
  await loadData();
  btn.disabled = false; btn.textContent = 'Refresh';
}

function renderAll() { renderTally(); renderTable(); }

function filtered() {
  return D.filter(d => {
    if (aStatus !== 'ALL' && d.action_status !== aStatus) return false;
    if (aLane !== 'ALL' && d.trade_lane !== aLane) return false;
    if (sQ) {
      const q = sQ.toLowerCase();
      const hay = [d.container_id, d.vessel_name, d.current_loc, d.origin_locode, d.dest_locode].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    let av = a[sCol], bv = b[sCol];
    if (typeof av === 'string') return sDir * String(av).localeCompare(String(bv));
    return sDir * ((+av || 0) - (+bv || 0));
  });
}

function renderTally() {
  const crit = D.filter(d => d.action_status === 'Critical').length;
  const warn = D.filter(d => d.action_status === 'Warning').length;
  const safe = D.filter(d => d.action_status === 'Safe').length;
  const total = D.length || 1;
  const exposure = D.filter(d => d.days_to_lfd <= 0).reduce((s, d) => s + Number(d.burn_rate_usd || 0), 0);

  document.getElementById('t-total').textContent = D.length;
  document.getElementById('t-crit').textContent = crit;
  document.getElementById('t-warn').textContent = warn;
  document.getElementById('t-safe').textContent = safe;
  document.getElementById('t-exposure').textContent = '$' + Math.round(exposure).toLocaleString();

  document.getElementById('tally-bar').innerHTML =
    `<div class="tally-seg critical" style="width:${crit/total*100}%"></div>` +
    `<div class="tally-seg warning" style="width:${warn/total*100}%"></div>` +
    `<div class="tally-seg safe" style="width:${safe/total*100}%"></div>`;
}

function statusPill(s) {
  const c = s === 'Critical' ? 'critical' : s === 'Warning' ? 'warning' : 'safe';
  return `<span class="pill ${c}"><span class="dot"></span>${s || 'Safe'}</span>`;
}

function daysCell(v) {
  const n = Number(v || 0);
  const cls = n <= 0 ? 'over' : n <= 2 ? 'soon' : '';
  return `<span class="days ${cls}">${n >= 0 ? '+' : ''}${n.toFixed(1)}</span>`;
}

function burnCell(d) {
  const accrued = Number(d.days_to_lfd || 0) <= 0 && Number(d.burn_rate_usd || 0) > 0;
  return `<span class="burn ${accrued ? 'acc' : ''}">$${Number(d.burn_rate_usd || 0).toLocaleString(undefined,{maximumFractionDigits:0})}${accrued ? ' accrued' : '/day'}</span>`;
}

function renderTable() {
  const rows = filtered();
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('rcount').textContent = rows.length + ' / ' + D.length;
  document.getElementById('tbody').innerHTML = rows.map(d => `
    <tr onclick="openDetail('${d.container_id}')">
      <td class="id">${d.container_id || '—'}</td>
      <td class="dim">${LANE_LABEL[d.trade_lane] || d.trade_lane || '—'}</td>
      <td class="dim">${STAGE_LABEL[d.lifecycle_stage] || d.lifecycle_stage || '—'}</td>
      <td class="route">${d.vessel_name || '—'} → ${d.dest_locode || '—'}</td>
      <td>${daysCell(d.days_to_lfd)}</td>
      <td>${burnCell(d)}</td>
      <td class="dim">${d.priority_score || 1}</td>
      <td>${statusPill(d.action_status)}</td>
    </tr>`).join('');
}

// Controls wiring
document.getElementById('status-filter').addEventListener('click', e => {
  if (!e.target.dataset.v) return;
  setStatus(e.target.dataset.v);
});
function setStatus(v) {
  aStatus = v;
  document.querySelectorAll('#status-filter .seg').forEach(b => b.classList.toggle('act', b.dataset.v === v));
  renderTable();
}
document.getElementById('lane-filter').addEventListener('change', e => { aLane = e.target.value; renderTable(); });
document.getElementById('search').addEventListener('input', e => { sQ = e.target.value; renderTable(); });
document.querySelectorAll('thead th').forEach(th => th.addEventListener('click', () => {
  const col = th.dataset.col;
  if (sCol === col) sDir *= -1; else { sCol = col; sDir = -1; }
  document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted'));
  th.classList.add('sorted');
  renderTable();
}));

// Detail panel
function openDetail(cid) {
  const d = D.find(x => x.container_id === cid);
  if (!d) return;

  document.getElementById('p-id').textContent = cid;
  document.getElementById('p-sub').textContent = (d.vessel_name || 'Unassigned') + ' · ' + (LANE_LABEL[d.trade_lane] || d.trade_lane || '—');

  const meta = [
    ['Route', (d.origin_locode || '?') + ' → ' + (d.dest_locode || '?')],
    ['Lease type', d.lease_type || '—'],
    ['Stage', STAGE_LABEL[d.lifecycle_stage] || d.lifecycle_stage || '—'],
    ['Status', d.action_status || '—'],
    ['Days to LFD', (Number(d.days_to_lfd||0) >= 0 ? '+' : '') + Number(d.days_to_lfd||0).toFixed(1)],
    ['Per diem', '$' + (d.per_diem_rate || 0) + '/day'],
    ['Free days', (d.agreed_free_days || 0) + ' days'],
    ['Burn to date', '$' + Number(d.burn_rate_usd || 0).toLocaleString()],
    ['7-day forecast', '$' + Number(d.projected_exposure_7d_usd || 0).toLocaleString()],
    ['Suggested action', d.repo_strategy || '—'],
  ];
  document.getElementById('p-meta').innerHTML = meta.map(([l, v]) =>
    `<div class="meta-item"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');

  const snaps = (H[cid] || []).slice().reverse().slice(0, 12);
  document.getElementById('p-hist').innerHTML = snaps.length
    ? snaps.map(s => `<div class="hist-row">
        <span class="t">${(s.ts||'').slice(0,16)}</span>
        <span class="s">${STAGE_LABEL[s.stage] || s.stage || '—'}</span>
        <span>${daysCell(s.dtl)}</span>
      </div>`).join('')
    : '<div class="hist-empty">No history recorded yet — snapshots accumulate each pipeline run.</div>';

  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
}

loadData();
</script>
</body>
</html>
