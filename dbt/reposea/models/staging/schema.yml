version: 2

models:
  - name: stg_containers
    description: Cleaned, typed one-row-per-container staging model.
    columns:
      - name: container_id
        description: Primary key — unique container identifier (BIC code).
        tests:
          - not_null
          - unique
      - name: trade_lane
        description: Lane code, foreign key to the trade lane dimension.
        tests:
          - not_null
          - relationships:
              to: ref('trade_lane_dim')
              field: trade_lane
      - name: lease_type
        tests:
          - not_null
          - accepted_values:
              values: ["One-Way", "Master Lease", "Long-Term"]
      - name: action_status
        tests:
          - not_null
          - accepted_values:
              values: ["Critical", "Warning", "Safe"]
      - name: per_diem_rate_usd
        tests:
          - not_null
      - name: pipeline_run_ts
        tests:
          - not_null
